# Reward ablation, wave 3: Reference: the current mix (as nft_hyperflow_64g) on the same budget.
# 2 nodes x 8 GPUs, same algorithm and budget as the 2-node mix runs (60 iterations, ~11 h); 4 ablations run at once on
# 64 GPUs, one hosts file per node pair. See README "Reward ablation".
#   bash scripts/launch_multinode.sh hosts_pair<N>.txt configs/experiments/ablation/mix_v1.yaml [run.efa=true]
algo: configs/algo/nft.yaml
reward:
  video: {va_ta: 1.0, soli_ta: 0.5, hps: 0.2, flow_motion: 0.5}
  audio: {}
  sync: {}
  worker_env: {FLOW_CAP: 3.0, FLOW_COH_MAX: 1.0}
model:
  hyperflow: default
  infer_steps: null
data:
  pool: prompts/t2va_pool_v2.jsonl   # held-out prompts (t2va_heldout_v2.jsonl) are not in it
  frames: [124]
  size: [544, 960]
  frame_sizes: {243: [480, 832]}
run:
  out: runs/abl_mix_v1
  iters: 60
  save_every: 10
  keep_recent: 2
  keep_every: 30            # keeps nft-00030 and nft-00060 for the held-out check
  keep_videos_every: 10
  train_gpus: [0, 1, 2, 3, 4, 5]
  reward_gpus: [6, 7]
  port: 29838
  smoke: true
