# Reward ablation, wave 3: configs/reward/quality_v2.yaml (as nft_hf_64g_quality) on the same budget.
# 2 nodes x 8 GPUs, same algorithm and budget as the 2-node mix runs (60 iterations, ~11 h); 4 ablations run at once on
# 64 GPUs, one hosts file per node pair. See README "Reward ablation".
#   bash scripts/launch_multinode.sh hosts_pair<N>.txt configs/experiments/ablation/quality_v2.yaml [run.efa=true]
algo: configs/algo/nft.yaml
reward: configs/reward/quality_v2.yaml
model:
  hyperflow: default
  infer_steps: null
data:
  pool: prompts/t2va_pool_v2.jsonl   # held-out prompts (t2va_heldout_v2.jsonl) are not in it
  frames: [124]
  size: [544, 960]
  frame_sizes: {243: [480, 832]}
run:
  out: runs/abl_quality_v2
  iters: 60
  save_every: 10
  keep_recent: 2
  keep_every: 30            # keeps nft-00030 and nft-00060 for the held-out check
  keep_videos_every: 10
  train_gpus: [0, 1, 2, 3, 4, 5]
  reward_gpus: [6, 7]
  port: 29839
  smoke: true
