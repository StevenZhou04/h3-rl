# Reward ablation, wave 2: All three VideoAlign heads.
# 64 GPUs (8 nodes x 8), the same setup as nft_hyperflow_64g but 60 iterations (~5.5 h; 24 prompt groups per
# iteration, 2x the 2-node runs). One ablation at a time. See README "Reward ablation".
#   bash scripts/launch_multinode.sh hosts.txt configs/experiments/ablation/va_all.yaml [run.efa=true]
algo: configs/algo/nft.yaml
algo_overrides:
  ranks_per_group: 2       # as nft_hyperflow_64g: each group split over 2 GPUs, 48 training ranks -> 24 groups
reward:
  video: {va_ta: 1.0, va_vq: 0.5, va_mq: 0.5}
  audio: {}
  sync: {}
model:
  hyperflow: default
  infer_steps: null
data:
  pool: prompts/t2va_pool_v2.jsonl   # held-out prompts (t2va_heldout_v2.jsonl) are not in it
  frames: [124]
  size: [544, 960]
  frame_sizes: {243: [480, 832]}
run:
  out: runs/abl_va_all
  iters: 60
  save_every: 10
  keep_recent: 2
  keep_every: 30            # keeps nft-00030 and nft-00060 for the held-out check
  keep_videos_every: 10
  train_gpus: [0, 1, 2, 3, 4, 5]
  reward_gpus: [6, 7]
  port: 29837
  smoke: true
