# Reward ablation, priority 10 of 13 (README "Priority"): Optical-flow motion alone: the only term that improved held-out in the mix; expect motion hacking.
# 64 GPUs (8 nodes x 8), one day: the nft_hyperflow_64g setup with only the reward changed (260 iterations,
# ~5.4 min each). Runs in parallel with the others, each on its own 64-GPU cluster. See README "Reward ablation".
#   bash scripts/launch_multinode.sh hosts.txt configs/experiments/ablation/flow_motion.yaml [run.efa=true]
algo: configs/algo/nft.yaml
algo_overrides:
  ranks_per_group: 2       # as nft_hyperflow_64g: each group split over 2 GPUs, 48 training ranks -> 24 groups
reward:
  video: {flow_motion: 1.0}
  audio: {}
  sync: {}
  worker_env: {FLOW_CAP: 3.0, FLOW_COH_MAX: 1.0}
model:
  hyperflow: default
  infer_steps: null
data:
  pool: prompts/t2va_pool_v2.jsonl   # held-out prompts (t2va_heldout_v2.jsonl) are not in it
  frames: [124]
  size: [544, 960]
  frame_sizes: {243: [480, 832]}
run:
  out: runs/abl_flow_motion
  iters: 260               # HPSv3++'s RL-progress input is iteration / iters: set iters to the planned length
  save_every: 10
  keep_recent: 3
  keep_every: 20
  keep_videos_every: 10
  train_gpus: [0, 1, 2, 3, 4, 5]
  reward_gpus: [6, 7]
  port: 29835
  smoke: true
