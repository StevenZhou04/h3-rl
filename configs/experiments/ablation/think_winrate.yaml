# Reward ablation, priority 8 of 14 (README "Priority"): Pairwise VLM judge alone (UnifiedReward-Think, both orders). Run reward_sanity.py on it first.
# 64 GPUs (8 nodes x 8), one day: as nft_hyperflow_64g but ranks_per_group 1 (group reward), so 48 groups per
# iteration and ~2x slower: 130 iterations (the same rollouts as the other ablations). Runs in parallel with the others. See README "Reward ablation".
#   bash scripts/launch_multinode.sh hosts.txt configs/experiments/ablation/think_winrate.yaml [run.efa=true]
algo: configs/algo/nft.yaml
algo_overrides:
  ranks_per_group: 1       # a group reward needs every group on one rank: 48 groups per iteration, ~2x slower
reward:
  video: {think_winrate: 1.0}
  audio: {}
  sync: {}
model:
  hyperflow: default
  infer_steps: null
data:
  pool: prompts/t2va_pool_v2.jsonl   # held-out prompts (t2va_heldout_v2.jsonl) are not in it
  frames: [124]
  size: [544, 960]
  frame_sizes: {243: [480, 832]}
run:
  out: runs/abl_think_winrate
  iters: 130
  save_every: 10
  keep_recent: 3
  keep_every: 20
  keep_videos_every: 10
  train_gpus: [0, 1, 2, 3, 4, 5]
  reward_gpus: [6, 7]
  port: 29833
  smoke: true
