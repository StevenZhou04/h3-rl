[project]
name = "h3rl"
version = "0.1.0"
description = "Reinforcement-learning post-training for the MiniMax-H3 video+audio generator: pick an algorithm and a reward in a config."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10, <3.13"
# Pinned, tested versions live in envs/main.txt; scripts/setup_env.sh installs them, torch (cu130) and the pinned
# upstream musubi-tuner that provides the MiniMax-H3 model code.
dependencies = ["omegaconf", "huggingface_hub", "numpy", "opencv-python"]

[tool.setuptools.packages.find]
include = ["h3rl*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
