# DiffusionNFT on HyperFlow MiniMax-H3, one day on 64 GPUs: 8 nodes x (6 training + 2 reward GPUs) = 48 training ranks.
# ranks_per_group 2: 24 prompt groups per iteration, each split over 2 GPUs; ~5.4 min per iteration (measured on one
# node), so 260 iterations ~ 24 h. 96 samples per optimizer step (2x the 2-node runs), 4 steps per iteration.
#   bash scripts/launch_multinode.sh hosts.txt configs/experiments/nft_hyperflow_64g.yaml [run.efa=true]
# Resume after an interruption (same command plus):  run.resume=runs/nft_hf_64g/nft-<N>.train.pt
# Held-out check of saved checkpoints afterwards:    bash scripts/heldout_eval.sh runs/heldout_64g 0,1,2,3 runs/nft_hf_64g/nft-*.safetensors
algo: configs/algo/nft.yaml
reward: configs/reward/mix_v1.yaml
algo_overrides:
  ranks_per_group: 2
model:
  hyperflow: default
  infer_steps: null
data:
  pool: prompts/t2va_pool_v2.jsonl   # ~2,000 5 s prompts: each used ~3 times in 260 iterations; held-out prompts are not in it
  frames: [124]
  size: [544, 960]
  frame_sizes: {243: [480, 832]}
run:
  out: runs/nft_hf_64g
  iters: 260                # HPSv3++'s RL-progress input is iteration / iters: set iters to the planned length
  save_every: 10            # LoRA ~285 MB; resume state ~2.3 GB
  keep_recent: 3            # resume states and LoRAs of the last 3 saves ...
  keep_every: 20            # ... plus every 20th iteration (13 checkpoints over the day) for the held-out comparison
  keep_videos_every: 10
  train_gpus: [0, 1, 2, 3, 4, 5]
  reward_gpus: [6, 7]
  port: 29810
  smoke: true
