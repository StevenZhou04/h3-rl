# Plain Flow-GRPO (SDE rollouts, clipped ratio), no SAGE switches.
name: grpo
lr: 1.0e-4
group_size: 8
prompts_per_step: 1
noise_level: 0.7
clip_range: 0.2
kl_beta: 0.0
sde_precise: false
grad_equalizer: false
tr_pos_beta: 0.0
tr_vel_beta: 0.0
ref_refresh_every: 20
grad_steps: 10         # backprop through this many of the recorded sampling steps per rollout (0 = all; all 29 is ~3x slower)
